<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>从夯到拉锐评</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/tier-list.css">
    <link rel="stylesheet" href="css/staging.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="css/status.css">
</head>
<body>

    <h1 contenteditable="plaintext-only">加载中...</h1>

    <!-- Connection Status -->
    <div id="conn-status" title="连接中" onclick="toggleStatusOverlay()" style="cursor:pointer;"></div>

    <!-- Tier List -->
    <div id="tier-wrap">
        <div id="tier-container"></div>
    </div>

    <!-- Bottom Area: Delete Zone + Staging Area -->
    <div id="bottom-area">
        <div id="delete-wrap">
            <div id="delete-zone">删除图片</div>
        </div>
        <div id="staging-wrap">
            <div id="staging-area"></div>
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="btn-row">
        <label class="file-btn" style="display:inline-block;cursor:pointer;">选择文件
            <input id="file-input" type="file" accept="image/png, image/jpeg, image/jpg, image/gif, image/webp, image/ico, image/x-icon, image/vnd.microsoft.icon, image/bmp, image/svg+xml, image/tiff, image/avif, image/heic, image/heif, image/jp2, image/jxl" multiple style="display:none;">
        </label>
        <button id="add-text-btn">添加文字</button>
        <button id="color-picker-link" onclick="toggleBgColorPicker()">更改背景颜色</button>
        <button id="stage-all-btn" class="reset-button">全部放入暂存区<span id="stage-all-progress" class="reset-progress"></span></button>
        <button id="reset-btn" class="reset-button">重置<span id="reset-progress" class="reset-progress"></span></button>
        <button id="save-preset-btn">保存为预设</button>
    </div>

    <!-- Background Color Picker -->
    <div id="backgroundcolorselectContainer">
        <div id="backgroundcolorselect">
            <span data-color="" title="透明" style="background:repeating-conic-gradient(#808080 0% 25%,#fff 0% 50%) 50%/12px 12px" onclick="changeBgColor('',this)"></span>
            <span data-color="#FF7F7F" style="background:#FF7F7F" onclick="changeBgColor('#FF7F7F', this)"></span>
            <span data-color="#FFBF7F" style="background:#FFBF7F" onclick="changeBgColor('#FFBF7F', this)"></span>
            <span data-color="#FFDF7F" style="background:#FFDF7F" onclick="changeBgColor('#FFDF7F', this)"></span>
            <span data-color="#FFFF7F" style="background:#FFFF7F" onclick="changeBgColor('#FFFF7F', this)"></span>
            <span data-color="#BFFF7F" style="background:#BFFF7F" onclick="changeBgColor('#BFFF7F', this)"></span>
            <span data-color="#7FFF7F" style="background:#7FFF7F" onclick="changeBgColor('#7FFF7F', this)"></span>
            <span data-color="#7FFFFF" style="background:#7FFFFF" onclick="changeBgColor('#7FFFFF', this)"></span>
            <span data-color="#7FBFFF" style="background:#7FBFFF" onclick="changeBgColor('#7FBFFF', this)"></span>
            <span data-color="#7F7FFF" style="background:#7F7FFF" onclick="changeBgColor('#7F7FFF', this)"></span>
            <span data-color="#FF7FFF" style="background:#FF7FFF" onclick="changeBgColor('#FF7FFF', this)"></span>
            <span data-color="#BF7FBF" style="background:#BF7FBF" onclick="changeBgColor('#BF7FBF', this)"></span>
            <span data-color="#3B3B3B" style="background:#3B3B3B" onclick="changeBgColor('#3B3B3B', this)"></span>
            <span data-color="#858585" style="background:#858585" onclick="changeBgColor('#858585', this)"></span>
            <span data-color="#CFCFCF" style="background:#CFCFCF" onclick="changeBgColor('#CFCFCF', this)"></span>
            <span data-color="#F7F7F7" style="background:#F7F7F7" onclick="changeBgColor('#F7F7F7', this)"></span>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="overlay">
        <div id="modal">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h4>选择标签背景颜色：</h4>
            <div id="color-select">
                <span data-color="" title="透明" style="background:repeating-conic-gradient(#808080 0% 25%,#fff 0% 50%) 50%/12px 12px" onclick="selectLabelColor('',this)"></span>
                <span data-color="#FF7F7F" style="background:#FF7F7F" onclick="selectLabelColor('#FF7F7F', this)"></span>
                <span data-color="#FFBF7F" style="background:#FFBF7F" onclick="selectLabelColor('#FFBF7F', this)"></span>
                <span data-color="#FFDF7F" style="background:#FFDF7F" onclick="selectLabelColor('#FFDF7F', this)"></span>
                <span data-color="#FFFF7F" style="background:#FFFF7F" onclick="selectLabelColor('#FFFF7F', this)"></span>
                <span data-color="#BFFF7F" style="background:#BFFF7F" onclick="selectLabelColor('#BFFF7F', this)"></span>
                <span data-color="#7FFF7F" style="background:#7FFF7F" onclick="selectLabelColor('#7FFF7F', this)"></span>
                <span data-color="#7FFFFF" style="background:#7FFFFF" onclick="selectLabelColor('#7FFFFF', this)"></span>
                <span data-color="#7FBFFF" style="background:#7FBFFF" onclick="selectLabelColor('#7FBFFF', this)"></span>
                <span data-color="#7F7FFF" style="background:#7F7FFF" onclick="selectLabelColor('#7F7FFF', this)"></span>
                <span data-color="#FF7FFF" style="background:#FF7FFF" onclick="selectLabelColor('#FF7FFF', this)"></span>
                <span data-color="#BF7FBF" style="background:#BF7FBF" onclick="selectLabelColor('#BF7FBF', this)"></span>
                <span data-color="#3B3B3B" style="background:#3B3B3B" onclick="selectLabelColor('#3B3B3B', this)"></span>
                <span data-color="#858585" style="background:#858585" onclick="selectLabelColor('#858585', this)"></span>
                <span data-color="#CFCFCF" style="background:#CFCFCF" onclick="selectLabelColor('#CFCFCF', this)"></span>
                <span data-color="#F7F7F7" style="background:#F7F7F7" onclick="selectLabelColor('#F7F7F7', this)"></span>
            </div>
            <h4>编辑标签文字：</h4>
            <textarea class="settings-label" maxlength="500" id="labelName" style="height:50px;"></textarea>
            <div class="modal-buttons">
                <button id="delete-row" onclick="deleteRow()">删除此行</button>
                <button id="clear-row" onclick="clearRow()">放入暂放区</button>
            </div>
            <div class="modal-buttons">
                <button id="add-row-up" onclick="applyColorSequence()">向下顺序填充颜色</button>
                <button id="add-row-below" onclick="addRow('below')">在下方插入行</button>
            </div>
        </div>
    </div>

    <!-- Image Fullscreen Overlay -->
    <div id="image-overlay" onclick="closeImageFullscreen(event)">
        <button class="close-btn" onclick="closeImageFullscreen()">&times;</button>
        <div id="image-overlay-content">
            <div id="image-name-bar" contenteditable="plaintext-only"></div>
            <img id="image-fullscreen" src="" alt="">
            <div id="fullscreen-color-select">
                <span data-color="" title="透明" style="background:repeating-conic-gradient(#808080 0% 25%,#fff 0% 50%) 50%/12px 12px"></span>
                <span data-color="#FF7F7F" style="background:#FF7F7F"></span>
                <span data-color="#FFBF7F" style="background:#FFBF7F"></span>
                <span data-color="#FFDF7F" style="background:#FFDF7F"></span>
                <span data-color="#FFFF7F" style="background:#FFFF7F"></span>
                <span data-color="#BFFF7F" style="background:#BFFF7F"></span>
                <span data-color="#7FFF7F" style="background:#7FFF7F"></span>
                <span data-color="#7FFFFF" style="background:#7FFFFF"></span>
                <span data-color="#7FBFFF" style="background:#7FBFFF"></span>
                <span data-color="#7F7FFF" style="background:#7F7FFF"></span>
                <span data-color="#FF7FFF" style="background:#FF7FFF"></span>
                <span data-color="#BF7FBF" style="background:#BF7FBF"></span>
                <span data-color="#3B3B3B" style="background:#3B3B3B"></span>
                <span data-color="#858585" style="background:#858585"></span>
                <span data-color="#CFCFCF" style="background:#CFCFCF"></span>
                <span data-color="#F7F7F7" style="background:#F7F7F7"></span>
            </div>
        </div>
    </div>

    <!-- Preset Selection Dialog -->
    <div id="preset-overlay">
        <div id="preset-modal">
            <h3>预设选择</h3>
            <div id="preset-list"></div>
            <div class="preset-buttons">
                <button id="preset-close-btn">关闭</button>
                <button id="preset-confirm-btn" class="reset-button">
                    确认重置<span id="preset-confirm-progress" class="reset-progress"></span>
                </button>
            </div>
        </div>
    </div>

    <!-- Save Preset Dialog -->
    <div id="save-preset-overlay">
        <div id="save-preset-modal">
            <h3>保存为预设</h3>
            <p class="save-preset-hint">请输入预设名称</p>
            <input id="save-preset-input" type="text" maxlength="100" placeholder="预设名称">
            <div class="save-preset-buttons">
                <button id="save-preset-close-btn">关闭</button>
                <button id="save-preset-confirm-btn">确认</button>
            </div>
        </div>
    </div>

    <!-- Status Overlay -->
    <div id="status-overlay">
        <div id="status-modal">
            <button class="close-btn" onclick="closeStatusOverlay()">&times;</button>
            <div class="online-count" id="online-count">在线: 0 人</div>
            <div class="online-user-list" id="online-user-list"></div>
            <div class="status-name-section">
                <input id="status-name-input" type="text" maxlength="50" placeholder="游客">
                <button id="status-save-name-btn">保存名称</button>
            </div>
            <div class="status-actions" id="status-auth-buttons"></div>
        </div>
    </div>

    <!-- Confirm Dialog -->
    <div id="confirm-overlay">
        <div id="confirm-modal">
            <p id="confirm-message"></p>
            <div class="confirm-buttons">
                <button id="confirm-cancel-btn">取消</button>
                <button id="confirm-ok-btn">确认</button>
            </div>
        </div>
    </div>

    <!-- Add Text Dialog -->
    <div id="add-text-overlay">
        <div id="add-text-modal">
            <h3>添加文字</h3>
            <textarea id="add-text-input" maxlength="128" placeholder="请输入文字内容" rows="1"></textarea>
            <div class="add-text-buttons">
                <button id="add-text-close-btn">取消</button>
                <button id="add-text-confirm-btn">添加</button>
            </div>
        </div>
    </div>

    <script src="js/state.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/connection.js"></script>
    <script src="js/drag-drop.js"></script>
    <script src="js/render.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/status.js"></script>
    <script src="js/main.js"></script>

    <footer style="text-align: center; padding: 4px 0;">
        <a href="https://github.com/DYG-FINT/TierListOnline" target="_blank" style="font-size: 12px; color: #999; text-decoration: none;">GitHub</a>
    </footer>
</body>
</html>
