<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>修改密码</title>
<link rel="stylesheet" href="/auth/css/auth.css">
</head>
<body>
<h2>修改密码</h2>
<div class="form-card">
    <div class="form-group">
        <label>原密码</label>
        <input id="old-password" type="password" maxlength="128" autocomplete="current-password">
    </div>
    <div class="form-group">
        <label>新密码</label>
        <input id="new-password" type="password" maxlength="128" autocomplete="new-password">
    </div>
    <div class="form-group">
        <label>确认新密码</label>
        <input id="confirm-password" type="password" maxlength="128" autocomplete="new-password">
    </div>
    <button class="btn btn-primary" onclick="changePassword()">修改密码</button>
    <div class="message" id="message"></div>
</div>
<div class="back"><a href="/">返回首页</a></div>

<script src="/auth/js/change-password.js"></script>
</body>
</html>
